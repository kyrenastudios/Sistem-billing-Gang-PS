<style>
body.login-page{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;background:#f5f6f8;color:#252525}
.login-card{width:min(420px,100%);box-sizing:border-box;background:#fff;border:1px solid #e7e9ee;border-radius:18px;padding:30px;box-shadow:0 8px 30px rgba(30,35,50,.10)}

#login-submit{width:100%;margin:8px 0 0;padding:12px;background:#4b56bd;color:#fff;border:0;border-radius:9px;font:600 1rem Poppins,sans-serif;cursor:pointer}#login-submit:disabled{opacity:.6;cursor:not-allowed}
#login-message{min-height:22px;margin-top:14px;text-align:center;color:#c62828;font-size:.9rem}
@media(max-width:480px){body.login-page{padding:14px}.login-card{padding:24px 20px;border-radius:14px}.login-logo{width:min(230px,80%)}}
</style>

    <h1 class="login-title">Login Pengguna</h1>
    <form id="login-form">
        <div class="login-field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus></div>
        <div class="login-field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button id="login-submit" type="submit">Masuk</button>
        <div id="login-message"></div>
    </form>
</div>
<script>
async function readApiResponse(response){
    const text=await response.text();
    try{return JSON.parse(text)}catch(e){
        const clean=text.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
        throw new Error(clean ? `Server API mengembalikan response tidak valid: ${clean.slice(0,240)}` : 'Server API tidak mengembalikan response.');
    }
}

(async()=>{try{const r=await fetch('./api/auth.php?action=me');const d=await readApiResponse(r);if(d.authenticated)window.location.replace('./index.html')}catch(e){}})();
const form=document.getElementById('login-form'),btn=document.getElementById('login-submit'),msg=document.getElementById('login-message');
form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;msg.textContent='Memproses...';try{const r=await fetch('./api/auth.php?action=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});const d=await readApiResponse(r);if(!r.ok||!d.success)throw new Error(d.message||'Login gagal.');window.location.replace('./index.html')}catch(err){msg.textContent=err.message;btn.disabled=false}});
</script>
</body></html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login | GANG PS</title>
<link rel="icon" href="/icon.png" type="image/png">
<link rel="stylesheet" href="./style.css">
<style>
body.login-page{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;background:#f5f6f8;color:#252525}
.login-card{width:min(420px,100%);box-sizing:border-box;background:#fff;border:1px solid #e7e9ee;border-radius:18px;padding:34px 30px;box-shadow:0 8px 30px rgba(30,35,50,.10)}
.login-brand{text-align:center;font-size:2rem;font-weight:700;color:#19183B;margin-bottom:6px}.login-title{text-align:center;font-size:1.2rem;color:#555966;margin:0 0 26px}
.login-field{margin-bottom:16px}.login-field label{display:block;margin-bottom:7px;font-weight:600}.login-field input{width:100%;box-sizing:border-box;padding:12px 13px;border:1px solid #d8dbe3;border-radius:9px;font:inherit}.login-field input:focus{outline:none;border-color:#4b56bd;box-shadow:0 0 0 3px rgba(75,86,189,.12)}
#login-submit{width:100%;margin:8px 0 0;padding:12px;background:#4b56bd;color:#fff;border:0;border-radius:9px;font:600 1rem Poppins,sans-serif;cursor:pointer}#login-submit:disabled{opacity:.6;cursor:not-allowed}
#login-message{min-height:22px;margin-top:14px;text-align:center;color:#c62828;font-size:.9rem}.login-help{text-align:center;margin-top:18px;color:#777b88;font-size:.8rem;line-height:1.5}
@media(max-width:480px){body.login-page{padding:14px}.login-card{padding:28px 20px;border-radius:14px}}
</style>
</head>
<body class="login-page">
<div class="login-card">
    <div class="login-brand">GANG PS</div>
    <h1 class="login-title">Login Pengguna</h1>
    <form id="login-form">
        <div class="login-field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus></div>
        <div class="login-field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button id="login-submit" type="submit">Masuk</button>
        <div id="login-message"></div>
    </form>
    <div class="login-help">Akun awal Admin: <strong>admin</strong> / <strong>admin123</strong><br>Segera buat akun Kasir dari menu Pengguna.</div>
</div>
<script>
(async()=>{try{const r=await fetch('./api/auth.php?action=me');const d=await r.json();if(d.authenticated)window.location.replace('./index.html')}catch(e){}})();
const form=document.getElementById('login-form'),btn=document.getElementById('login-submit'),msg=document.getElementById('login-message');
form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;msg.textContent='Memproses...';try{const r=await fetch('./api/auth.php?action=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||'Login gagal.');window.location.replace('./index.html')}catch(err){msg.textContent=err.message;btn.disabled=false}});
</script>
</body></html>

<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pengguna | GANG PS</title><link rel="icon" href="/icon.png" type="image/png"><link rel="stylesheet" href="./style.css"><style>
body.users-page{background:#f5f6f8;color:#252525}.users-page h1{color:#24273a}.user-panel{background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:20px;margin-bottom:20px}.user-form{display:grid;grid-template-columns:1.2fr 1.2fr .8fr auto;gap:10px;align-items:end}.user-form label{display:block;font-weight:600;margin-bottom:6px}.user-form input,.user-form select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d8dbe3;border-radius:7px;font:inherit}.user-form button{margin:0}.users-table-wrap{overflow:auto}.users-table{width:100%;border-collapse:collapse;background:#fff}.users-table th,.users-table td{padding:11px 12px;border-bottom:1px solid #e7e9ee;text-align:left;white-space:nowrap}.users-table th{background:#f8f8fb}.role-badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:.78rem;font-weight:600}.role-admin{background:#e8eaf6;color:#303f9f}.role-kasir{background:#e8f5e9;color:#2e7d32}.status-active{color:#2e7d32;font-weight:600}.status-off{color:#c62828;font-weight:600}.user-actions button{margin:2px;padding:7px 9px;font-size:.82rem}.btn-danger{background:#d32f2f}.btn-danger:hover{background:#b71c1c}.user-note{color:#777b88;font-size:.85rem;margin-top:10px}.user-message{min-height:20px;margin-top:10px;font-size:.9rem}@media(max-width:760px){.user-form{grid-template-columns:1fr}.users-table{font-size:.85rem}}
</style></head>
<body class="users-page"><div class="container"><nav></nav><h1>Pengguna</h1>
<div class="user-panel"><h3 style="text-align:left;margin-top:0">Tambah Pengguna</h3><form id="user-form" class="user-form"><div><label for="new-username">Username</label><input id="new-username" required minlength="3"></div><div><label for="new-password">Password</label><input id="new-password" type="password" required minlength="6"></div><div><label for="new-role">Role</label><select id="new-role"><option value="kasir">Kasir</option><option value="admin">Admin</option></select></div><button type="submit">Tambah</button></form><div id="user-message" class="user-message"></div><div class="user-note">Admin dapat mengelola pengguna dan menghapus riwayat penjualan. Kasir dapat menjalankan operasional tetapi tidak dapat menghapus riwayat.</div></div>
<div class="user-panel"><h3 style="text-align:left;margin-top:0">Daftar Pengguna</h3><div class="users-table-wrap"><table class="users-table"><thead><tr><th>No.</th><th>Username</th><th>Role</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="users-body"></tbody></table></div></div>
</div><footer>GANG PS Ponorogo &copy; <span id="copyright-year"></span></footer>
<script src="./nav.js"></script><script>
const body=document.getElementById('users-body'),form=document.getElementById('user-form'),message=document.getElementById('user-message');
const rupiahApi='./api/users.php';
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function loadUsers(){const r=await fetch(rupiahApi);const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||'Gagal memuat pengguna.');body.innerHTML=d.users.map((u,i)=>`<tr><td>${i+1}</td><td>${esc(u.username)}</td><td><span class="role-badge ${u.role==='admin'?'role-admin':'role-kasir'}">${u.role==='admin'?'Admin':'Kasir'}</span></td><td class="${u.is_active?'status-active':'status-off'}">${u.is_active?'Aktif':'Nonaktif'}</td><td class="user-actions"><button type="button" onclick="changePassword(${u.id},'${esc(u.username)}')">Password</button><button type="button" onclick="toggleUser(${u.id},${u.is_active?'true':'false'})">${u.is_active?'Nonaktifkan':'Aktifkan'}</button>${u.id!==window.gangPsUser.id?`<button type="button" class="btn-danger" onclick="deleteUser(${u.id},'${esc(u.username)}')">Hapus</button>`:''}</td></tr>`).join('');}
form.addEventListener('submit',async e=>{e.preventDefault();message.textContent='';try{const r=await fetch(rupiahApi,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('new-username').value.trim(),password:document.getElementById('new-password').value,role:document.getElementById('new-role').value})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||'Gagal.');form.reset();message.style.color='#2e7d32';message.textContent=d.message;await loadUsers()}catch(e){message.style.color='#c62828';message.textContent=e.message}});
async function toggleUser(id,active){try{const r=await fetch(rupiahApi,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,is_active:!active})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message);await loadUsers()}catch(e){alert(e.message)}}
async function changePassword(id,username){const password=prompt('Password baru untuk '+username+' (minimal 6 karakter):');if(password===null)return;if(password.length<6){alert('Password minimal 6 karakter.');return}try{const r=await fetch(rupiahApi,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,password})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message);alert('Password berhasil diubah.')}catch(e){alert(e.message)}}
async function deleteUser(id,username){if(!confirm('Hapus pengguna '+username+'?'))return;try{const r=await fetch(rupiahApi+'?id='+id,{method:'DELETE'});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message);await loadUsers()}catch(e){alert(e.message)}}
loadUsers().catch(e=>{message.style.color='#c62828';message.textContent=e.message});
</script></body></html>

<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Laporan Penjualan | Gang-PS</title><link rel="stylesheet" href="./style.css"><style>
/*======== Sales Neutral Light Theme ========*/
body.sales-page{background:#f5f6f8!important;color:#252525!important}body.sales-page>.container{background:#fff!important;box-shadow:0 3px 18px rgba(30,35,50,.08)}body.sales-page h1,body.sales-page h2,body.sales-page h3{color:#24273a!important}body.sales-page #sales-controls{color:#555966}body.sales-page #sales-controls input{background:#fff;color:#29283a;border-color:#dedde7}body.sales-page table{background:#fff}body.sales-page table th{background:#f8f8fb!important;color:#555966!important}body.sales-page table td{background:#fff;color:#393847}body.sales-page .session-card{background:#fff}body.sales-page footer{color:#111!important;border-top-color:#e3e5ea!important}
#session-summary-list{display:flex;gap:16px;flex-wrap:wrap}.session-card{flex:1 1 220px;min-width:200px;border:2px solid #4caf50;border-radius:12px;padding:16px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08)}.session-card h4{margin:0 0 10px;font-size:1.05em;color:#1a531b;text-align:center}.session-card .session-total{margin:0 0 10px;font-weight:700;color:#1e4d86}.session-card .session-item{margin:4px 0;color:#333}.session-card .session-empty{padding:12px;color:#777;text-align:center}.ps3-card{border-color:#1976d2}.ps4-card{border-color:#388e3c}.ps5-card{border-color:#d32f2f}
</style></head><body class="sales-page"><div class="container"><nav></nav><h1>Laporan Penjualan</h1><div id="sales-controls" style="display:flex;gap:12px;align-items:center;margin-bottom:16px;"><label>Dari: <input type="date" id="sales-from"></label><label>Sampai: <input type="date" id="sales-to"></label><button id="refresh-sales">Tampilkan</button><button id="export-csv" style="margin-left:8px;background:#4caf50;">Export CSV</button></div><div style="display:flex;gap:24px;flex-wrap:wrap;"><div style="flex:1 1 400px;min-width:300px;"><canvas id="top-items-chart" height="400"></canvas></div><div style="flex:0 1 320px;min-width:260px;"><h3>Ringkasan Terlaris</h3><ul id="top-items-list" style="list-style:none;padding-left:0;"></ul></div></div><hr><h3>Sesi per Konsol (rekap terpilih)</h3><div id="session-summary" style="margin-bottom:18px;"><div id="session-summary-list"></div></div><hr><h3>Semua Item (rekap terpilih)</h3><table id="sales-table" style="width:100%;border-collapse:collapse;"><thead><tr><th>Nama Item</th><th>Terjual (pcs)</th></tr></thead><tbody id="sales-table-body"></tbody></table></div><footer>GANG PS Ponorogo &copy; <span id="copyright-year"></span></footer><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="./dialog.js"></script><script src="./nav.js"></script><script src="./db-sync.js"></script><script src="./sales.js"></script></body></html>

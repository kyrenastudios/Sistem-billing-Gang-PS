<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Riwayat Penjualan</title><link rel="stylesheet" href="./style.css"><link rel="icon" href="/icon.png" type="image/png"><style>
/*======== History Neutral Light Theme ========*/
body.history-page{background:#f5f6f8!important;color:#252525!important}body.history-page>.container{background:#fff!important;box-shadow:0 3px 18px rgba(30,35,50,.08)}body.history-page h1{color:#24273a!important}body.history-page #history-controls{color:#555966}body.history-page #history-table{background:#fff}body.history-page #history-table th{background:#f8f8fb;color:#555966}body.history-page #history-table td{background:#fff;color:#393847}body.history-page #daily-summary-container{background:#fff;border-color:#e7e9ee;box-shadow:0 2px 10px rgba(30,35,50,.04)}body.history-page .summary-pill{background:#f5f6f8;border-color:#e2e4e9;color:#393847}body.history-page #daily-total-main{color:#303f9f}body.history-page #total-revenue-container{background:#f8f9fb}body.history-page footer{color:#111!important;border-top-color:#e3e5ea!important}
</style></head><body class="history-page"><div class="container"><nav></nav><h1>Histori</h1><div id="recap-modal" class="modal"><div class="modal-content" style="max-width:600px;"><span class="close-btn">&times;</span><h3>Buat Rekap Penjualan</h3><div class="form-group" style="display:flex;gap:15px;"><div style="flex:1;"><label for="recap-start-date">Dari Tanggal:</label><input type="date" id="recap-start-date"></div><div style="flex:1;"><label for="recap-end-date">Sampai Tanggal:</label><input type="date" id="recap-end-date"></div></div><button id="generate-recap-btn" style="width:100%;">Buat Rekap</button><hr style="margin:20px 0;"><div id="recap-results"></div></div></div><div id="history-controls"><label for="history-date">Pilih Tanggal:</label><input type="date" id="history-date"><button id="open-recap-btn">📈 Buat Rekap Penjualan</button></div><div id="daily-summary-container"><div id="daily-total-main"></div><div id="daily-total-breakdown"><div id="daily-rental-total" class="summary-pill"></div><div id="daily-sales-total" class="summary-pill"></div></div></div><table id="history-table"><thead><tr><th>No.</th><th>Konsol dan Paket</th><th>Waktu dan Durasi</th><th>Detail Biaya</th><th>Pesanan & Catatan</th><th>Aksi</th></tr></thead><tbody id="history-body"></tbody></table><div id="total-revenue"></div><p id="no-history-message" style="text-align:center;display:none;">Belum ada Transaksi pada tanggal ini.</p></div><footer>GANG PS Ponorogo &copy; <span id="copyright-year"></span></footer><script src="./dialog.js"></script><script src="./nav.js"></script><script src="./db-sync.js"></script><script src="./history.js"></script><script src="./history-pagination.js"></script></body></html>

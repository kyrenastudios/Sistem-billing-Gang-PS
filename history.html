<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histori</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/icon.jpeg" type="image/png">
</head>
<body>
    <div class="container">
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="manage.html">Kelola PS</a>
            <a href="history.html" class="active">Histori</a>
            <a href="menu.html">Menu Pesanan</a>
            <a href="kasir.html">Kasir</a>
        </nav>

        <h1>Histori</h1>

        <div id="history-controls">
            <label for="history-date">Pilih Tanggal:</label>
            <input type="date" id="history-date">
        </div>

        <table id="history-table">
            <thead>
                <tr>
                    <th>Konsol</th>
                    <th>Waktu</th>
                    <th>Detail Biaya</th>
                    <th>Pesanan & Catatan</th>
                </tr>
            </thead>
            <tbody id="history-body">
                </tbody>
        </table>
        <div id="total-revenue"></div>
        <p id="no-history-message" style="text-align:center; display:none;">Tidak ada Histori pada tanggal yang dipilih.</p>
    </div>
    <script src="scripts/history.js"></script>
</body>
</html>

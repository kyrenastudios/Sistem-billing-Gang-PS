<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Histori</title><link rel="stylesheet" href="./style.css"><link rel="icon" href="/icon.png" type="image/png"></head><body><div class="container">

<h1>Histori</h1><div id="recap-modal" class="modal"><div class="modal-content" style="max-width:600px;"><span class="close-btn">&times;</span><h3>Buat Rekap Penjualan</h3><div class="form-group" style="display:flex;gap:15px;"><div style="flex:1;"><label for="recap-start-date">Dari Tanggal:</label><input type="date" id="recap-start-date"></div><div style="flex:1;"><label for="recap-end-date">Sampai Tanggal:</label><input type="date" id="recap-end-date"></div></div><button id="generate-recap-btn" style="width:100%;">Buat Rekap</button><hr style="margin:20px 0;"><div id="recap-results"></div></div></div>
<div id="history-controls"><label for="history-date">Pilih Tanggal:</label><input type="date" id="history-date"><button id="open-recap-btn">📈 Buat Rekap Penjualan</button></div>
<div id="daily-summary-container"><div id="daily-total-main"></div><div id="daily-total-breakdown"><div id="daily-rental-total" class="summary-pill"></div><div id="daily-sales-total" class="summary-pill"></div></div></div>
<table id="history-table"><thead><tr><th>Konsol dan Paket</th><th>Waktu dan Durasi</th><th>Detail Biaya</th><th>Pesanan & Catatan</th><th>Aksi</th></tr></thead><tbody id="history-body"></tbody></table><div id="total-revenue"></div><p id="no-history-message" style="text-align:center;display:none;">Belum ada Transaksi pada tanggal ini.</p></div>

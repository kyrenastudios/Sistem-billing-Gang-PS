<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efek Tombol Tenggelam</title>
    <style>
        /* CSS untuk membuat latar belakang gelap agar tombol terlihat jelas */
        body {
            background-color: #1e2a3a; /* Warna latar belakang gelap seperti di gambar */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        /* Ini adalah bagian utama untuk gaya tombol */
        .pushable-button {
            position: relative;
            border: none;
            background: transparent;
            padding: 0;
            cursor: pointer;
            outline-offset: 4px;
            transition: filter 0.3s;
        }

        .button-shadow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            background: hsl(0deg 0% 0% / 0.25);
            transform: translateY(2px);
            transition: transform 0.2s;
        }

        .button-edge {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            /* Warna pinggiran bawah yang lebih gelap dari warna utama tombol */
            background: linear-gradient(
                to left,
                hsl(46deg 100% 32%) 0%,
                hsl(46deg 100% 42%) 8%,
                hsl(46deg 100% 42%) 92%,
                hsl(46deg 100% 32%) 100%
            );
        }

        .button-front {
            display: block;
            position: relative;
            padding: 12px 32px;
            border-radius: 12px;
            font-size: 1.25rem;
            font-weight: bold;
            color: #333; /* Warna teks gelap */
            /* Warna utama tombol */
            background-color: #f4c531; /* Kuning seperti di gambar */
            transform: translateY(-4px); /* Efek timbul awal */
            transition: transform 0.2s;
        }

        /* Efek saat tombol ditekan */
        .pushable-button:active .button-front {
            transform: translateY(-1px); /* Tombol sedikit turun, membuatnya terlihat tenggelam */
        }
        
        .pushable-button:active .button-shadow {
            transform: translateY(1px); /* Bayangan juga sedikit turun */
        }

        /* Efek saat mouse hover di atas tombol */
        .pushable-button:hover:not(:active) {
            filter: brightness(1.1); /* Sedikit lebih cerah saat disentuh mouse */
        }
    </style>
</head>
<body>

    <button class="pushable-button">
      <span class="button-shadow"></span>
      <span class="button-edge"></span>
      <span class="button-front">
        Tekan Saya
      </span>
    </button>

</body>
</html>

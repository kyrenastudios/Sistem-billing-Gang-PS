<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Paket</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container">
        <nav>
            <a href="/index.html">Dashboard</a>
            <a href="manage.html">Kelola PS</a>
            <a href="paket.html" class="active">Kelola Paket</a>
            <a href="history.html">Histori</a>
            <a href="menu.html">Menu Pesanan</a>
            <a href="kasir.html">Kasir</a>
        </nav>

        <h1>Kelola Paket Kustom</h1>

        <div style="display: flex; gap: 30px; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 300px;">
                <h3 id="form-title">Tambah Paket Baru</h3>
                <form id="paket-form">
                    <input type="hidden" id="paket-id">
                    <div class="form-group">
                        <label for="paket-name">Nama Paket</label>
                        <input type="text" id="paket-name" placeholder="Contoh: Paket Malam, Promo Jumat" required>
                    </div>
                    <div class="form-group">
                        <label for="paket-duration">Durasi (Menit)</label>
                        <input type="number" id="paket-duration" placeholder="Contoh: 60 untuk 1 jam" required min="1">
                    </div>
                    <div class="form-group">
                        <label for="paket-price">Harga (Rp)</label>
                        <input type="number" id="paket-price" placeholder="Contoh: 5000" required min="0">
                    </div>
                    <div class="form-group">
                        <label for="paket-console-type">Berlaku untuk Tipe PS</label>
                        <select id="paket-console-type" required>
                            <option value="PS3">PS3</option>
                            <option value="PS4">PS4</option>
                            <option value="PS5">PS5</option>
                        </select>
                    </div>
                    <button type="submit" id="submit-btn">Simpan Paket</button>
                    <button type="button" id="cancel-edit-btn" style="display:none; background-color: #757575;">Batal Edit</button>
                </form>
            </div>

            <div style="flex: 2; min-width: 400px;">
                <h3>Daftar Paket Saat Ini</h3>
                <table id="paket-list-table">
                    <thead>
                        <tr>
                            <th>Nama Paket</th>
                            <th>Tipe PS</th>
                            <th>Durasi</th>
                            <th>Harga</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="paket-list-body">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="../scripts/paket.js"></script>
</body>
</html>

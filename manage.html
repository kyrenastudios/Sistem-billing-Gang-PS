<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola PS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="manage.html" class="active">Kelola PS</a>
            <a href="history.html">Riwayat</a>
            <a href="menu.html">Menu Pesanan</a>
            <a href="kasir.html">Kasir</a>
        </nav>

        <h1>Kelola Jumlah PS</h1>
        <p style="text-align: center;">Atur jumlah unit untuk setiap tipe PlayStation di sini.</p>
        
        <form id="manage-form">
            <div class="form-group">
                <label for="ps3-count">Jumlah PS3:</label>
                <input type="number" id="ps3-count" value="0" min="0">
            </div>
            <div class="form-group">
                <label for="ps4-count">Jumlah PS4:</label>
                <input type="number" id="ps4-count" value="0" min="0">
            </div>
            <div class="form-group">
                <label for="ps5-count">Jumlah PS5:</label>
                <input type="number" id="ps5-count" value="0" min="0">
            </div>
            <button type="submit">Simpan Perubahan</button>
        </form>

        <hr style="margin: 30px 0;">

        <div style="text-align:center;">
            <h2>Pengaturan Lanjutan</h2>
            <button id="reset-all-data-btn" class="btn-stop">Reset Semua Data</button>
            <p><small>Tindakan ini akan menghapus semua data konsol dan riwayat transaksi secara permanen.</small></p>
        </div>
    </div>
    <script src="manage.js"></script>
</body>
</html>

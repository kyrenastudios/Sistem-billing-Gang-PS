<body><div class="container">

<h1>Kelola Member Play Pass</h1>
<div style="display:flex;gap:30px;flex-wrap:wrap;"><div style="flex:1;min-width:300px;"><h3>Tambah Member Baru</h3><form id="member-form"><div class="form-group"><label for="member-name">Nama Member</label><input type="text" id="member-name" placeholder="Masukkan nama" required></div><div class="form-group"><label>Harga Pass (21 Sesi)</label><input type="text" value="Rp 300.000" disabled style="background-color:#eee;"></div><button type="submit">Tambah Member</button></form></div>
<div style="flex:2;min-width:400px;"><h3>Daftar Member Aktif</h3><div class="form-group" style="margin-bottom:20px;"><label for="search-member">🔍 Cari Nama Member:</label><input type="text" id="search-member" placeholder="Ketik nama member..."></div><table id="paket-list-table"><thead><tr><th>Nama Member</th><th>Pemakaian</th><th>Sisa</th><th>Tanggal Dibuat</th><th>Aksi</th></tr></thead><tbody id="member-list-body"></tbody></table></div></div></div>
<div id="member-history-modal" class="modal"><div class="modal-content" style="max-width:500px;"><span class="close-btn">&times;</span><h3>Histori Pemakaian untuk <span id="history-member-name"></span></h3><div id="member-history-list"></div></div></div>
